app:
  database_url: ""
  poll_interval_seconds: 900
  request_timeout_seconds: 20

  # نام‌های قبلی - برای سازگاری حفظ شده‌اند
  min_delay_between_requests_seconds: 2
  max_delay_between_requests_seconds: 5

  # نام‌های جدید - اگر جایی از پروژه استفاده شود
  poll_delay_min_seconds: 2
  poll_delay_max_seconds: 5


# اگر endpoint کرون داری، این مقدار را در Render env هم می‌توانی ست کنی:
# CRON_SECRET
cron_secret: ""


notifications:
  console:
    enabled: true


  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""


  sms:
    enabled: true
    provider: "melipayamak"

    # شماره خط ارسال ملی‌پیامک
    sender: "5000xxx"

    # امکان fallback برای token
    # اگر melipayamak.token خالی باشد، از این مقدار استفاده می‌شود.
    api_key: ""

    # fallback گیرنده برای سازگاری با تنظیمات قبلی
    receptor: ""

    # قالب اختصاصی پیامک
    # نکته مهم:
    # در قالب پیش‌فرض، لینک کالا وجود ندارد.
    #
    # Placeholder های قابل استفاده:
    # {product_name}
    # {custom_name}
    # {title}
    # {digikala_title}
    # {product_id}
    # {dkp}
    # {availability}
    # {status}
    # {brand}
    # {category}
    # {best_seller}
    # {best_price}
    # {best_price_toman}
    # {best_list_price}
    # {best_list_price_toman}
    # {discount}
    # {discount_percent}
    # {warranty}
    # {lead_time}
    # {seller_rating}
    # {reasons}
    # {reason_count}
    #
    # اگر واقعاً خواستی لینک را در SMS بگذاری:
    # {url}
    # ولی پیشنهاد نمی‌شود.
    template: |
      گزارش پایش دیجیکالا
      کالا: {product_name}
      شناسه: {product_id}
      وضعیت: {availability}
      قیمت: {best_price}
      فروشنده: {best_seller}

    # حداکثر تعداد دلیل‌هایی که در پیامک نمایش داده می‌شود
    max_reasons: 3

    melipayamak:
      # token موجود در URL کنسول ملی‌پیامک
      #
      # مثال:
      # token: "b4b3616319254f30888d8d7dffc80f9d"
      #
      # بهتر است این مقدار را در Render Environment Variables قرار بدهی:
      # MELIPAYAMAK_TOKEN
      token: "YOUR_REAL_TOKEN"

      # حالت‌های قابل استفاده:
      #
      # advanced
      # simple
      # schedule
      # shared
      # otp
      mode: "advanced"

      # برای حالت advanced، چند گیرنده مجاز است.
      # برای حالت simple، schedule، shared و otp نیز
      # هر گیرنده به‌صورت جداگانه ارسال می‌شود.
      #
      # بهتر است روی Render این را با env بدهی:
      # MELIPAYAMAK_RECIPIENTS=09204874731,09123456789
      recipients:
        - "09204874731"

      # فقط برای حالت advanced
      udh: ""

      # فقط برای حالت schedule
      schedule:
        date: "1/20/2023 15:22"
        period: 365

      # فقط برای حالت shared / service
      body_id: null
      args: []


  bale:
    enabled: false
    bot_token: ""
    chat_id: ""


web:
  host: "127.0.0.1"
  port: 8000


defaults:
  conditions:
    notify_when_available: true
    notify_when_unavailable: true
    max_price_toman: null
    min_discount_percent: null
    only_digikala_seller: false
    seller_names_include: []
    seller_names_exclude: []
    notify_on_any_price_change: false
    notify_on_price_drop_percent: null
    notify_on_seller_change: true
    notify_on_new_seller: true
    notify_on_removed_seller: true
    notify_on_discount_change: true
    min_stock_count: null
    allowed_warranties: []
    blocked_warranties: []
