<h2>آخرین اعلان‌ها</h2>

{% if notifications %}
<table>
  <thead>
    <tr>
      <th>زمان</th>
      <th>نوع رویداد</th>
      <th>پیام</th>
    </tr>
  </thead>
  <tbody>
    {% for n in notifications %}
    <tr>
      <td>{{ n["created_at"] or "-" }}</td>
      <td>{{ n["event_type"] or "-" }}</td>
      <td><pre>{{ n["message"] or "-" }}</pre></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>هنوز اعلانی برای این محصول ثبت نشده است.</p>
{% endif %}
